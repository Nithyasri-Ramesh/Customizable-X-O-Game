<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO — Neon Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ─── ROOT VARIABLES ──────────────────────────────────────────────── */
:root {
  --bg:        #080b14;
  --bg2:       #0d1120;
  --card:      #111827;
  --border:    #1e2d45;
  --p1:        #00f5ff;
  --p2:        #ff2d78;
  --ai:        #b04cff;
  --gold:      #ffd700;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --glow-p1:   0 0 20px #00f5ff88, 0 0 60px #00f5ff33;
  --glow-p2:   0 0 20px #ff2d7888, 0 0 60px #ff2d7833;
  --glow-ai:   0 0 20px #b04cff88, 0 0 60px #b04cff33;
  --glow-gold: 0 0 20px #ffd70088, 0 0 60px #ffd70033;
  --radius:    12px;
  --transition: .25s cubic-bezier(.4,0,.2,1);
}

/* ─── RESET ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── BACKGROUND GRID ─────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,245,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(0,245,255,.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ─── LAYOUT ──────────────────────────────────────────────────────── */
#app {
  position: relative; z-index: 1;
  max-width: 960px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

/* ─── HEADER ──────────────────────────────────────────────────────── */
header {
  text-align: center;
  padding: 32px 0 24px;
}
.logo-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(2rem, 6vw, 3.6rem);
  font-weight: 900;
  letter-spacing: .12em;
  background: linear-gradient(135deg, var(--p1) 0%, var(--ai) 50%, var(--p2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 24px rgba(0,245,255,.4));
}
.logo-sub {
  margin-top: 6px;
  font-size: .9rem;
  letter-spacing: .3em;
  color: var(--muted);
  text-transform: uppercase;
}

/* ─── CARD ────────────────────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,245,255,.03) 0%, transparent 60%);
  pointer-events: none;
}

/* ─── SECTION HEADINGS ────────────────────────────────────────────── */
.section-label {
  font-family: 'Orbitron', monospace;
  font-size: .65rem;
  letter-spacing: .25em;
  color: var(--p1);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* ─── BUTTON GROUP / PILLS ────────────────────────────────────────── */
.pill-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.pill {
  font-family: 'Orbitron', monospace;
  font-size: .7rem;
  letter-spacing: .1em;
  padding: 8px 18px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--muted);
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
  white-space: nowrap;
}
.pill:hover {
  border-color: var(--p1);
  color: var(--p1);
  box-shadow: var(--glow-p1);
}
.pill.active {
  background: rgba(0,245,255,.12);
  border-color: var(--p1);
  color: var(--p1);
  box-shadow: var(--glow-p1);
}
.pill.mode-ai.active  { background: rgba(176,76,255,.12); border-color: var(--ai); color: var(--ai); box-shadow: var(--glow-ai); }
.pill.mode-ai:hover   { border-color: var(--ai); color: var(--ai); box-shadow: var(--glow-ai); }
.pill.diff-easy.active   { --dc:#4ade80; background:rgba(74,222,128,.12); border-color:var(--dc); color:var(--dc); box-shadow:0 0 20px #4ade8044; }
.pill.diff-medium.active { --dc:#fbbf24; background:rgba(251,191,36,.12); border-color:var(--dc); color:var(--dc); box-shadow:0 0 20px #fbbf2444; }
.pill.diff-hard.active   { --dc:#f97316; background:rgba(249,115,22,.12); border-color:var(--dc); color:var(--dc); box-shadow:0 0 20px #f9731644; }
.pill.diff-super.active  { --dc:#ff2d78; background:rgba(255,45,120,.12); border-color:var(--dc); color:var(--dc); box-shadow:0 0 20px #ff2d7844; }

/* ─── SYMBOL INPUTS ───────────────────────────────────────────────── */
.symbol-inputs {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}
.symbol-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-width: 120px;
}
.symbol-field label {
  font-size: .75rem;
  letter-spacing: .15em;
  color: var(--muted);
  text-transform: uppercase;
}
.symbol-field input {
  font-size: 1.5rem;
  text-align: center;
  width: 100%;
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  outline: none;
  transition: var(--transition);
  font-family: inherit;
}
.symbol-field input:focus {
  border-color: var(--p1);
  box-shadow: var(--glow-p1);
}
.symbol-field.p2 input:focus { border-color: var(--p2); box-shadow: var(--glow-p2); }
.symbol-field.ai input:focus { border-color: var(--ai); box-shadow: var(--glow-ai); }

/* ─── WIN CONDITION ───────────────────────────────────────────────── */
.win-cond-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.win-cond-row label { font-size: .9rem; color: var(--muted); }
.spin-input {
  display: flex;
  align-items: center;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg2);
}
.spin-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none;
  color: var(--p1); font-size: 1.1rem;
  cursor: pointer; transition: var(--transition);
  font-family: 'Orbitron', monospace;
}
.spin-btn:hover { background: rgba(0,245,255,.1); }
#win-cond-val {
  width: 40px; text-align: center;
  font-family: 'Orbitron', monospace;
  font-size: 1rem; color: var(--text);
  background: none; border: none; outline: none;
  pointer-events: none;
}

/* ─── START BUTTON ────────────────────────────────────────────────── */
.btn-start {
  width: 100%;
  padding: 16px;
  font-family: 'Orbitron', monospace;
  font-size: 1rem;
  letter-spacing: .2em;
  font-weight: 700;
  border: none;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--p1), var(--ai));
  color: #000;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.btn-start::before {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0);
  transition: var(--transition);
}
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0,245,255,.4); }
.btn-start:hover::before { background: rgba(255,255,255,.1); }
.btn-start:active { transform: translateY(0); }

/* ─── GAME AREA ───────────────────────────────────────────────────── */
#game-area { display: none; }
#game-area.visible { display: block; }

/* ─── SCOREBOARD ──────────────────────────────────────────────────── */
.scoreboard {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.score-card {
  flex: 1;
  padding: 14px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg2);
  text-align: center;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.score-card.active::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px;
}
.score-card.p1.active::after { background: var(--p1); box-shadow: var(--glow-p1); }
.score-card.p2.active::after { background: var(--p2); box-shadow: var(--glow-p2); }
.score-card.draw.active::after { background: var(--gold); }

.score-card .s-symbol { font-size: 1.4rem; line-height: 1; }
.score-card .s-label  {
  font-size: .6rem; letter-spacing: .2em; color: var(--muted);
  text-transform: uppercase; margin: 4px 0 2px;
  font-family: 'Orbitron', monospace;
}
.score-card .s-val {
  font-family: 'Orbitron', monospace;
  font-size: 1.5rem; font-weight: 900;
}
.score-card.p1 .s-val   { color: var(--p1); }
.score-card.p2 .s-val   { color: var(--p2); }
.score-card.draw .s-val { color: var(--gold); }

/* ─── TURN INDICATOR ──────────────────────────────────────────────── */
#turn-bar {
  text-align: center;
  margin-bottom: 18px;
  font-family: 'Orbitron', monospace;
  font-size: .85rem;
  letter-spacing: .15em;
  color: var(--muted);
  min-height: 24px;
  transition: var(--transition);
}
#turn-bar span.highlight {
  padding: 2px 12px;
  border-radius: 100px;
}
#turn-bar span.p1-hl { color: var(--p1); text-shadow: var(--glow-p1); }
#turn-bar span.p2-hl { color: var(--p2); text-shadow: var(--glow-p2); }

/* ─── GAME META ───────────────────────────────────────────────────── */
.game-meta {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.meta-tag {
  font-size: .7rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 100px;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Orbitron', monospace;
}

/* ─── BOARD ───────────────────────────────────────────────────────── */
#board-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}
#board {
  display: grid;
  gap: 6px;
  width: 100%;
  max-width: 560px;
}
.cell {
  aspect-ratio: 1;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 2rem;
  line-height: 1;
  transition: background var(--transition), border-color var(--transition), transform .12s;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.cell::before {
  content: '';
  position: absolute; inset: 0;
  opacity: 0;
  transition: opacity var(--transition);
}
.cell:hover:not(.taken) { border-color: rgba(0,245,255,.4); }
.cell:hover:not(.taken)::before { opacity: 1; background: rgba(0,245,255,.06); }
.cell:active:not(.taken) { transform: scale(.94); }
.cell.p1 { border-color: rgba(0,245,255,.5); }
.cell.p2 { border-color: rgba(255,45,120,.5); }
.cell.winning { animation: winPulse .6s ease infinite alternate; }
.cell.p1.winning { box-shadow: inset 0 0 20px rgba(0,245,255,.3), var(--glow-p1); }
.cell.p2.winning { box-shadow: inset 0 0 20px rgba(255,45,120,.3), var(--glow-p2); }

@keyframes winPulse {
  from { transform: scale(1); }
  to   { transform: scale(1.06); }
}
.cell-symbol {
  display: inline-block;
  animation: popIn .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { transform: scale(0) rotate(-20deg); opacity: 0; }
  to   { transform: scale(1) rotate(0); opacity: 1; }
}

/* ─── ACTION BUTTONS ──────────────────────────────────────────────── */
.action-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-action {
  padding: 10px 24px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-family: 'Orbitron', monospace;
  font-size: .7rem;
  letter-spacing: .15em;
  cursor: pointer;
  transition: var(--transition);
}
.btn-action:hover { border-color: var(--p1); color: var(--p1); box-shadow: var(--glow-p1); }
.btn-action.danger:hover { border-color: var(--p2); color: var(--p2); box-shadow: var(--glow-p2); }

/* ─── NOTIFICATION BANNER ─────────────────────────────────────────── */
#notif {
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  min-width: 280px;
  max-width: 90vw;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px 32px;
  text-align: center;
  transition: top .5s cubic-bezier(.34,1.4,.64,1);
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
#notif.show { top: 30px; }
#notif .n-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
#notif .n-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: .1em;
  margin-bottom: 4px;
}
#notif .n-sub { font-size: .9rem; color: var(--muted); }
#notif.win-p1 { border-color: var(--p1); box-shadow: var(--glow-p1), 0 20px 60px rgba(0,0,0,.6); }
#notif.win-p2 { border-color: var(--p2); box-shadow: var(--glow-p2), 0 20px 60px rgba(0,0,0,.6); }
#notif.win-draw{ border-color: var(--gold); box-shadow: var(--glow-gold), 0 20px 60px rgba(0,0,0,.6); }

/* ─── HISTORY ─────────────────────────────────────────────────────── */
#history-section { margin-top: 10px; }
.history-list {
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.h-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--bg2);
  border: 1px solid var(--border);
  font-size: .85rem;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; } }
.h-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.h-dot.p1   { background: var(--p1); }
.h-dot.p2   { background: var(--p2); }
.h-dot.draw { background: var(--gold); }
.h-row .h-desc { flex: 1; color: var(--muted); }
.h-row .h-time { font-size: .7rem; color: var(--border); }
.btn-clear-hist {
  margin-top: 10px;
  padding: 6px 16px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: none;
  color: var(--muted);
  font-size: .7rem;
  letter-spacing: .1em;
  cursor: pointer;
  transition: var(--transition);
  font-family: 'Orbitron', monospace;
}
.btn-clear-hist:hover { border-color: var(--p2); color: var(--p2); }

/* ─── CONFETTI ────────────────────────────────────────────────────── */
#confetti-canvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 999;
}

/* ─── AI THINKING INDICATOR ───────────────────────────────────────── */
#ai-thinking {
  text-align: center;
  font-family: 'Orbitron', monospace;
  font-size: .7rem;
  letter-spacing: .2em;
  color: var(--ai);
  opacity: 0;
  transition: opacity .3s;
  height: 20px;
  margin-bottom: 8px;
}
#ai-thinking.show { opacity: 1; }
.dot-flash { animation: dotFlash 1.2s infinite; }
.dot-flash:nth-child(2) { animation-delay: .2s; }
.dot-flash:nth-child(3) { animation-delay: .4s; }
@keyframes dotFlash {
  0%,80%,100% { opacity: .2; }
  40%          { opacity: 1; }
}

/* ─── RESPONSIVE ──────────────────────────────────────────────────── */
@media (max-width: 520px) {
  .card { padding: 18px; }
  .scoreboard { gap: 8px; }
  .score-card .s-val { font-size: 1.2rem; }
  .cell { font-size: 1.4rem; border-radius: 8px; }
  #board { gap: 4px; }
}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div id="notif" role="alert" aria-live="assertive">
  <span class="n-emoji" id="n-emoji"></span>
  <div class="n-title" id="n-title"></div>
  <div class="n-sub"   id="n-sub"></div>
</div>

<div id="app">
  <header>
    <div class="logo-title">XO ARENA</div>
    <div class="logo-sub">Neon Tic-Tac-Toe · Ultimate Edition</div>
  </header>

  <!-- ── SETUP PANEL ── -->
  <div id="setup-panel">
    <div class="card">
      <div class="section-label">Game Mode</div>
      <div class="pill-group" id="mode-group">
        <button class="pill mode-2p active" data-mode="2p">👥 2 Player</button>
        <button class="pill mode-ai"       data-mode="ai">🤖 Vs AI</button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Board Size</div>
      <div class="pill-group" id="size-group">
        <button class="pill active" data-size="3">3 × 3</button>
        <button class="pill"        data-size="4">4 × 4</button>
        <button class="pill"        data-size="5">5 × 5</button>
        <button class="pill"        data-size="6">6 × 6</button>
        <button class="pill"        data-size="7">7 × 7</button>
      </div>

      <div style="margin-top:20px;">
        <div class="section-label">Win Condition</div>
        <div class="win-cond-row">
          <label>Match</label>
          <div class="spin-input">
            <button class="spin-btn" id="wc-minus">−</button>
            <input  id="win-cond-val" readonly value="3">
            <button class="spin-btn" id="wc-plus">+</button>
          </div>
          <label>in a row to win</label>
        </div>
      </div>
    </div>

    <div class="card" id="diff-card" style="display:none;">
      <div class="section-label">AI Difficulty</div>
      <div class="pill-group" id="diff-group">
        <button class="pill diff-easy"   data-diff="easy">🟢 Easy</button>
        <button class="pill diff-medium active" data-diff="medium">🟡 Medium</button>
        <button class="pill diff-hard"   data-diff="hard">🟠 Hard</button>
        <button class="pill diff-super"  data-diff="super">🔴 Super Hard</button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Custom Symbols</div>
      <div class="symbol-inputs">
        <div class="symbol-field p1">
          <label>Player 1</label>
          <input id="sym-p1" maxlength="4" placeholder="✖" value="Enter your customizable symbol">
        </div>
        <div class="symbol-field p2" id="sym-p2-field">
          <label>Player 2</label>
          <input id="sym-p2" maxlength="4" placeholder="◯" value="Enter your customizable symbol">
        </div>
        <div class="symbol-field ai" id="sym-ai-field" style="display:none;">
          <label>AI</label>
          <input id="sym-ai" maxlength="4" placeholder="👾" value="👾">
        </div>
      </div>
    </div>

    <button class="btn-start" id="btn-start">⚡ LAUNCH GAME</button>
  </div>

  <!-- ── GAME AREA ── -->
  <div id="game-area">
    <div class="scoreboard">
      <div class="score-card p1 active" id="sc-p1">
        <div class="s-symbol" id="sc-p1-sym">✖</div>
        <div class="s-label"  id="sc-p1-lbl">Player 1</div>
        <div class="s-val"    id="sc-p1-val">0</div>
      </div>
      <div class="score-card draw" id="sc-draw">
        <div class="s-symbol">🤝</div>
        <div class="s-label">Draw</div>
        <div class="s-val" id="sc-draw-val">0</div>
      </div>
      <div class="score-card p2" id="sc-p2">
        <div class="s-symbol" id="sc-p2-sym">◯</div>
        <div class="s-label"  id="sc-p2-lbl">Player 2</div>
        <div class="s-val"    id="sc-p2-val">0</div>
      </div>
    </div>

    <div class="game-meta">
      <span class="meta-tag" id="meta-size"></span>
      <span class="meta-tag" id="meta-mode"></span>
      <span class="meta-tag" id="meta-diff" style="display:none;"></span>
      <span class="meta-tag" id="meta-wc"></span>
    </div>

    <div id="ai-thinking">
      AI THINKING
      <span class="dot-flash">.</span>
      <span class="dot-flash">.</span>
      <span class="dot-flash">.</span>
    </div>

    <div id="turn-bar"></div>

    <div id="board-wrap">
      <div id="board"></div>
    </div>

    <div class="action-row">
      <button class="btn-action" id="btn-restart">↺ Restart</button>
      <button class="btn-action danger" id="btn-newgame">✕ New Game</button>
    </div>
  </div>

  <!-- ── HISTORY ── -->
  <div id="history-section" class="card">
    <div class="section-label">Match History</div>
    <div class="history-list" id="history-list"></div>
    <button class="btn-clear-hist" id="btn-clear-hist">Clear History</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   XO ARENA — Modular JavaScript
   ═══════════════════════════════════════════════════════════════════ */

/* ─── STATE ─────────────────────────────────────────────────────── */
const S = {
  mode:    '2p',
  size:    3,
  winCond: 3,
  diff:    'medium',
  symP1:   '✖',
  symP2:   '◯',
  symAI:   '👾',
  board:   [],
  current: 1,       // 1 = player1, 2 = player2/ai
  over:    false,
  scores:  { p1:0, p2:0, draw:0 },
  locked:  false,
};

/* ─── AUDIO ──────────────────────────────────────────────────────── */
const Audio_ = (() => {
  const ctx = window.AudioContext ? new AudioContext() : null;
  function beep(freq, dur, vol=.3, type='sine') {
    if (!ctx) return;
    try {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch(e){}
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  return {
    place() { resume(); beep(440,.08,.25,'square'); },
    win()   { resume();
      [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2,.3,'sine'),i*90)); },
    draw()  { resume(); beep(220,.4,.2,'sawtooth'); },
    click() { resume(); beep(660,.05,.1); },
  };
})();

/* ─── WIN DETECTION ──────────────────────────────────────────────── */
function checkWinner(board, size, n) {
  const get = (r,c) => board[r*size+c];
  function scan(r,c,dr,dc) {
    const sym = get(r,c); if (!sym) return null;
    const cells = [[r,c]];
    for (let i=1;i<n;i++) {
      const nr=r+dr*i, nc=c+dc*i;
      if (nr<0||nr>=size||nc<0||nc>=size||get(nr,nc)!==sym) return null;
      cells.push([nr,nc]);
    }
    return { sym, cells };
  }
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (let r=0;r<size;r++) for (let c=0;c<size;c++) {
    for (const [dr,dc] of dirs) {
      const res = scan(r,c,dr,dc);
      if (res) return res;
    }
  }
  if (board.every(Boolean)) return { sym:'draw', cells:[] };
  return null;
}

/* ─── AI LOGIC ───────────────────────────────────────────────────── */
const AI = (() => {
  function score(board, size, n, aiSym, humanSym, depth) {
    const w = checkWinner(board, size, n);
    if (w) {
      if (w.sym === aiSym)    return 100 - depth;
      if (w.sym === humanSym) return depth - 100;
      if (w.sym === 'draw')   return 0;
    }
    return null;
  }

  function minimax(board, size, n, aiSym, humanSym, isMax, depth, maxDepth, alpha, beta) {
    const s = score(board, size, n, aiSym, humanSym, depth);
    if (s !== null) return s;
    if (depth >= maxDepth) return 0;

    const empties = board.reduce((a,v,i)=>v?a:[...a,i],[]);
    if (isMax) {
      let best = -Infinity;
      for (const idx of empties) {
        board[idx] = aiSym;
        best = Math.max(best, minimax(board,size,n,aiSym,humanSym,false,depth+1,maxDepth,alpha,beta));
        board[idx] = '';
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const idx of empties) {
        board[idx] = humanSym;
        best = Math.min(best, minimax(board,size,n,aiSym,humanSym,true,depth+1,maxDepth,alpha,beta));
        board[idx] = '';
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
      return best;
    }
  }

  function scoreSegment(seg, aiSym, humanSym) {
    const ai = seg.filter(c=>c===aiSym).length;
    const hu = seg.filter(c=>c===humanSym).length;
    const em = seg.filter(c=>!c).length;
    if (ai && hu) return 0;
    if (ai) return Math.pow(10, ai);
    if (hu) return -Math.pow(10, hu);
    return 0;
  }

  function heuristic(board, size, n, aiSym, humanSym) {
    let total = 0;
    const get = (r,c) => board[r*size+c];
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let r=0;r<size;r++) for (let c=0;c<size;c++) {
      for (const [dr,dc] of dirs) {
        const seg = [];
        for (let i=0;i<n;i++) {
          const nr=r+dr*i, nc=c+dc*i;
          if (nr<0||nr>=size||nc<0||nc>=size) break;
          seg.push(get(nr,nc));
        }
        if (seg.length===n) total += scoreSegment(seg, aiSym, humanSym);
      }
    }
    return total;
  }

  function bestMove(board, size, n, aiSym, humanSym, diff) {
    const empties = board.reduce((a,v,i)=>v?a:[...a,i],[]);
    if (!empties.length) return -1;

    // Easy: random with occasional smart
    if (diff === 'easy') {
      if (Math.random() < .75) return empties[Math.floor(Math.random()*empties.length)];
    }

    // Medium: check win/block, else random
    if (diff === 'medium') {
      for (const sym of [aiSym, humanSym]) {
        for (const idx of empties) {
          board[idx] = sym;
          if (checkWinner(board,size,n)) { board[idx]=''; return idx; }
          board[idx] = '';
        }
      }
      if (Math.random()<.4) return empties[Math.floor(Math.random()*empties.length)];
    }

    // Hard / Super: minimax with depth limits
    const maxDepth = diff==='hard' ? 4 : (size<=4?10:6);

    // Always check immediate win/block first
    for (const sym of [aiSym, humanSym]) {
      for (const idx of empties) {
        board[idx] = sym;
        if (checkWinner(board,size,n)) { board[idx]=''; return idx; }
        board[idx] = '';
      }
    }

    let best = -Infinity, bestIdx = empties[0];
    // Prioritise centre-ish cells
    const sorted = [...empties].sort((a,b) => {
      const ra=Math.floor(a/size),ca=a%size, rb=Math.floor(b/size),cb=b%size;
      const da=Math.abs(ra-(size-1)/2)+Math.abs(ca-(size-1)/2);
      const db=Math.abs(rb-(size-1)/2)+Math.abs(cb-(size-1)/2);
      return da-db;
    });

    for (const idx of sorted) {
      board[idx] = aiSym;
      let val;
      if (diff === 'super' && size <= 4) {
        val = minimax(board,size,n,aiSym,humanSym,false,0,maxDepth,-Infinity,Infinity);
      } else {
        // Use heuristic for larger boards
        const imm = score(board,size,n,aiSym,humanSym,0);
        val = imm !== null ? imm : heuristic(board,size,n,aiSym,humanSym);
        if (diff !== 'easy') {
          val += minimax(board,size,n,aiSym,humanSym,false,0,Math.min(maxDepth,3),-Infinity,Infinity)*0.6;
        }
      }
      board[idx] = '';
      if (val > best) { best=val; bestIdx=idx; }
    }
    return bestIdx;
  }

  return { bestMove };
})();

/* ─── CONFETTI ───────────────────────────────────────────────────── */
const Confetti = (() => {
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  let pieces = [], raf = null;

  function resize() { canvas.width=innerWidth; canvas.height=innerHeight; }
  window.addEventListener('resize', resize); resize();

  function launch(color='#00f5ff') {
    pieces = [];
    const colors = [color,'#fff','#ffd700','#ff2d78','#b04cff'];
    for (let i=0;i<140;i++) pieces.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height*.4 - 80,
      vx:(Math.random()-.5)*6,
      vy: Math.random()*4+2,
      rot: Math.random()*360,
      rspeed:(Math.random()-.5)*8,
      size: Math.random()*8+4,
      color: colors[Math.floor(Math.random()*colors.length)],
      alpha: 1, shape: Math.random()<.5?'rect':'circle',
    });
    if (raf) cancelAnimationFrame(raf);
    step();
    setTimeout(stop, 3200);
  }

  function step() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=.08;
      p.rot+=p.rspeed; p.alpha-=.008;
      if (p.alpha<=0) return;
      ctx.save();
      ctx.globalAlpha=p.alpha;
      ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      if (p.shape==='circle') { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      else { ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); }
      ctx.restore();
    });
    raf = requestAnimationFrame(step);
  }
  function stop() { cancelAnimationFrame(raf); ctx.clearRect(0,0,canvas.width,canvas.height); }
  return { launch };
})();

/* ─── NOTIFICATIONS ──────────────────────────────────────────────── */
const Notif = (() => {
  const el = document.getElementById('notif');
  let t;
  function show(emoji, title, sub, cls='') {
    document.getElementById('n-emoji').textContent = emoji;
    document.getElementById('n-title').textContent = title;
    document.getElementById('n-sub').textContent   = sub;
    el.className = 'show ' + cls;
    clearTimeout(t);
    t = setTimeout(hide, 3600);
  }
  function hide() { el.className = ''; }
  return { show, hide };
})();

/* ─── HISTORY ────────────────────────────────────────────────────── */
const History = (() => {
  const KEY = 'xo-arena-history';
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e){ return []; }
  }
  function save(arr) {
    try { localStorage.setItem(KEY, JSON.stringify(arr.slice(-50))); } catch(e){}
  }
  function add(entry) {
    const arr = load();
    arr.push({ ...entry, time: new Date().toLocaleTimeString() });
    save(arr);
    render();
  }
  function clear() { save([]); render(); }
  function render() {
    const list = document.getElementById('history-list');
    const arr  = load().reverse();
    list.innerHTML = arr.length ? '' : '<div style="color:var(--muted);font-size:.8rem;padding:10px 0;">No matches yet.</div>';
    arr.forEach(e => {
      const row = document.createElement('div');
      row.className = 'h-row';
      const cls = e.winner==='draw'?'draw':e.winner==='p1'?'p1':'p2';
      row.innerHTML = `
        <div class="h-dot ${cls}"></div>
        <div class="h-desc">${e.desc}</div>
        <div class="h-time">${e.time}</div>`;
      list.appendChild(row);
    });
  }
  return { add, clear, render };
})();

/* ─── UI HELPERS ─────────────────────────────────────────────────── */
function $(id) { return document.getElementById(id); }

function initPillGroup(groupId, cb) {
  document.getElementById(groupId).querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(groupId).querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Audio_.click();
      cb(btn);
    });
  });
}

/* ─── BOARD RENDERING ────────────────────────────────────────────── */
function renderBoard() {
  const board = $('board');
  board.style.gridTemplateColumns = `repeat(${S.size}, 1fr)`;
  board.innerHTML = '';
  S.board.forEach((val, idx) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (val ? ' taken' : '');
    if (val === S.symP1) cell.classList.add('p1');
    if (val === S.symP2 || val === S.symAI) cell.classList.add('p2');
    // Font size based on grid size
    const fs = S.size <= 3 ? 2 : S.size <= 4 ? 1.7 : S.size <= 5 ? 1.35 : S.size <= 6 ? 1.1 : .9;
    cell.style.fontSize = fs + 'rem';
    if (val) {
      const span = document.createElement('span');
      span.className = 'cell-symbol';
      span.textContent = val;
      cell.appendChild(span);
    }
    if (!S.over && !val) cell.addEventListener('click', () => handleMove(idx));
    board.appendChild(cell);
  });
}

function markWinningCells(cells) {
  const allCells = $('board').querySelectorAll('.cell');
  cells.forEach(([r,c]) => {
    const idx = r * S.size + c;
    allCells[idx].classList.add('winning');
  });
}

function updateTurnBar() {
  const bar = $('turn-bar');
  if (S.over) { bar.innerHTML = ''; return; }
  const sym  = S.current===1 ? S.symP1 : (S.mode==='ai' ? S.symAI : S.symP2);
  const name = S.current===1 ? 'Player 1' : (S.mode==='ai' ? 'AI' : 'Player 2');
  const cls  = S.current===1 ? 'p1-hl' : 'p2-hl';
  bar.innerHTML = `<span class="highlight ${cls}">${sym} ${name}'s Turn</span>`;
}

function updateScoreDisplay() {
  $('sc-p1-val').textContent   = S.scores.p1;
  $('sc-p2-val').textContent   = S.scores.p2;
  $('sc-draw-val').textContent = S.scores.draw;
  $('sc-p1').classList.toggle('active', S.current===1 && !S.over);
  $('sc-p2').classList.toggle('active', S.current===2 && !S.over);
}

/* ─── GAME LOGIC ─────────────────────────────────────────────────── */
function handleMove(idx) {
  if (S.locked || S.over || S.board[idx]) return;
  S.locked = true;
  const sym = S.current===1 ? S.symP1 : (S.mode==='ai' ? S.symAI : S.symP2);
  S.board[idx] = sym;
  Audio_.place();
  renderBoard();

  const result = checkWinner(S.board, S.size, S.winCond);
  if (result) {
    endGame(result);
    return;
  }

  S.current = S.current===1 ? 2 : 1;
  updateTurnBar();
  updateScoreDisplay();

  if (S.mode==='ai' && S.current===2) {
    $('ai-thinking').classList.add('show');
    const delay = S.diff==='easy'?200:S.diff==='medium'?350:500;
    setTimeout(() => {
      const move = AI.bestMove([...S.board], S.size, S.winCond, S.symAI, S.symP1, S.diff);
      $('ai-thinking').classList.remove('show');
      if (move !== -1) {
        S.board[move] = S.symAI;
        Audio_.place();
        renderBoard();
        const r2 = checkWinner(S.board, S.size, S.winCond);
        if (r2) { endGame(r2); return; }
        S.current = 1;
        updateTurnBar();
        updateScoreDisplay();
        S.locked = false;
      } else { S.locked = false; }
    }, delay);
    return;
  }
  S.locked = false;
}

function endGame(result) {
  S.over = true;
  updateTurnBar();
  $('sc-p1').classList.remove('active');
  $('sc-p2').classList.remove('active');
  $('sc-draw').classList.add('active');

  if (result.sym === 'draw') {
    S.scores.draw++;
    Audio_.draw();
    Notif.show('🤝','DRAW!','Well played by both sides.','win-draw');
    History.add({ winner:'draw', desc:`Draw · ${S.size}×${S.size} · ${S.mode==='ai'?'Vs AI':'2 Player'}` });
  } else {
    const isP1 = result.sym === S.symP1;
    const isAI = result.sym === S.symAI;
    if (isP1) S.scores.p1++; else S.scores.p2++;
    markWinningCells(result.cells);
    Audio_.win();
    const name = isP1 ? 'Player 1' : (S.mode==='ai' ? 'AI 🤖' : 'Player 2');
    const cls  = isP1 ? 'win-p1' : 'win-p2';
    const color= isP1 ? '#00f5ff' : '#ff2d78';
    Notif.show(result.sym, `${name} WINS!`, `${S.winCond} in a row!`, cls);
    Confetti.launch(color);
    History.add({ winner: isP1?'p1':'p2',
      desc:`${result.sym} ${name} won · ${S.size}×${S.size} · ${S.mode==='ai'?`Vs AI (${S.diff})`:'2 Player'}` });
  }
  updateScoreDisplay();
}

function resetBoard() {
  S.board   = Array(S.size * S.size).fill('');
  S.over    = false;
  S.locked  = false;
  S.current = 1;
  $('ai-thinking').classList.remove('show');
  renderBoard();
  updateTurnBar();
  updateScoreDisplay();
  $('sc-draw').classList.remove('active');
}

/* ─── SETUP → GAME ───────────────────────────────────────────────── */
function startGame() {
  S.symP1 = $('sym-p1').value.trim() || '✖';
  S.symP2 = $('sym-p2').value.trim() || '◯';
  S.symAI = $('sym-ai').value.trim() || '👾';
  S.scores = { p1:0, p2:0, draw:0 };

  // Update scoreboard labels
  $('sc-p1-sym').textContent = S.symP1;
  $('sc-p2-sym').textContent = S.mode==='ai' ? S.symAI : S.symP2;
  $('sc-p1-lbl').textContent = 'Player 1';
  $('sc-p2-lbl').textContent = S.mode==='ai' ? 'AI' : 'Player 2';

  // Meta tags
  $('meta-size').textContent = `${S.size} × ${S.size}`;
  $('meta-mode').textContent = S.mode==='ai' ? '🤖 Vs AI' : '👥 2 Player';
  $('meta-wc').textContent   = `Win: ${S.winCond} in a row`;
  const diffEl = $('meta-diff');
  if (S.mode==='ai') {
    diffEl.textContent = `🎮 ${S.diff.charAt(0).toUpperCase()+S.diff.slice(1)}`;
    diffEl.style.display='';
  } else {
    diffEl.style.display='none';
  }

  $('setup-panel').style.display = 'none';
  $('game-area').classList.add('visible');
  resetBoard();
  Audio_.click();
}

/* ─── SETUP UI WIRING ────────────────────────────────────────────── */
function initSetup() {
  initPillGroup('mode-group', btn => {
    S.mode = btn.dataset.mode;
    $('diff-card').style.display     = S.mode==='ai' ? '' : 'none';
    $('sym-ai-field').style.display  = S.mode==='ai' ? '' : 'none';
    $('sym-p2-field').style.display  = S.mode==='ai' ? 'none' : '';
  });

  initPillGroup('size-group', btn => {
    S.size = +btn.dataset.size;
    const wc = Math.min(S.winCond, S.size);
    S.winCond = wc < 3 ? 3 : wc;
    $('win-cond-val').value = S.winCond;
  });

  initPillGroup('diff-group', btn => { S.diff = btn.dataset.diff; });

  $('wc-minus').addEventListener('click', () => {
    if (S.winCond > 3) { S.winCond--; $('win-cond-val').value = S.winCond; Audio_.click(); }
  });
  $('wc-plus').addEventListener('click', () => {
    if (S.winCond < S.size) { S.winCond++; $('win-cond-val').value = S.winCond; Audio_.click(); }
  });

  $('btn-start').addEventListener('click', startGame);

  $('btn-restart').addEventListener('click', () => {
    Audio_.click(); resetBoard();
  });
  $('btn-newgame').addEventListener('click', () => {
    Audio_.click();
    $('game-area').classList.remove('visible');
    $('setup-panel').style.display = '';
    Notif.hide();
  });
  $('btn-clear-hist').addEventListener('click', () => { History.clear(); Audio_.click(); });
}

/* ─── BOOT ───────────────────────────────────────────────────────── */
initSetup();
History.render();
</script>
</body>
</html>
